# Public HTTPS: always combine with compose.prod.yml and the same project name.
# Requires Docker Compose 2.24.4+ for !override.
services:
  api:
    environment:
      REGISTRATION_ENABLED: "false"
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      PUBLIC_APP_URL: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
  worker:
    environment:
      REGISTRATION_ENABLED: "false"
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      PUBLIC_APP_URL: https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}
  frontend:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.public", "--adapter", "caddyfile"]
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME to your DNS hostname}
    ports: !override
      - "80:8080"
      - "443:8443"
    networks:
      - default
      - ticket_edge
    volumes:
      - type: bind
        source: ./frontend/Caddyfile.public
        target: /etc/caddy/Caddyfile.public
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]

# Shared only by the two public proxies; application databases stay isolated.
networks:
  ticket_edge:
    external: true
    name: ticket-edge

volumes:
  caddy_data:
  caddy_config:
